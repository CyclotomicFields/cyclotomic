[package]
name = "gap-cyclotom-reference"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-or-later"
description = "Standalone GAP-derived cyclotomic arithmetic reference for benchmarks"

[features]
default = []
libgap = []

[dependencies]
rug = { version = "=1.17.0", default-features = false, features = ["integer", "rational"] }
smallvec = "1.15.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
cyclotomic = { path = "../.." }

[[example]]
name = "like_for_like"
path = "examples/like_for_like.rs"

[[example]]
name = "rational_like_for_like"
path = "examples/rational_like_for_like.rs"
required-features = ["libgap"]

[[example]]
name = "stress_like_for_like"
path = "examples/stress_like_for_like.rs"
required-features = ["libgap"]

[[example]]
name = "character_table_workloads"
path = "examples/character_table_workloads.rs"
required-features = ["libgap"]

[[example]]
name = "literal_gap_vs_libgap"
path = "examples/literal_gap_vs_libgap.rs"
required-features = ["libgap"]

[[example]]
name = "tagged_gap_vs_libgap"
path = "examples/tagged_gap_vs_libgap.rs"
required-features = ["libgap"]

[[example]]
name = "tagged_character_tables"
path = "examples/tagged_character_tables.rs"
required-features = ["libgap"]

[[bench]]
name = "tagged_character_tables"
path = "benches/tagged_character_tables.rs"
harness = false
required-features = ["libgap"]
