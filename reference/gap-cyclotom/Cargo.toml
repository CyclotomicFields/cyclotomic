[package]
name = "gap-cyclotom-reference"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-or-later"
description = "Standalone GAP-derived cyclotomic arithmetic reference for benchmarks"

[features]
default = []
libgap = []

[build-dependencies]
cc = "1"

[dev-dependencies]
cyclotomic = { path = "../.." }
rug = { version = "=1.17.0", default-features = false, features = ["integer", "rational"] }

[[example]]
name = "like_for_like"
path = "examples/like_for_like.rs"

[[example]]
name = "rational_like_for_like"
path = "examples/rational_like_for_like.rs"
required-features = ["libgap"]

[[example]]
name = "stress_like_for_like"
path = "examples/stress_like_for_like.rs"
required-features = ["libgap"]
